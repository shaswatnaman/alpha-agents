name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check app/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check app/ tests/

      - name: Type check (mypy)
        run: uv run mypy app/ --ignore-missing-imports
        continue-on-error: true   # mypy is advisory in early development

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml
        env:
          OPENAI_API_KEY: test-key
          DATABASE_URL: postgresql+asyncpg://alphaagents:alphaagents@localhost:5432/alphaagents
          REDIS_URL: redis://localhost:6379/0
          VALID_API_KEYS: dev-key-1,dev-key-2

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t alphaagents:ci --target runtime .

      - name: Check image builds successfully
        run: docker run --rm alphaagents:ci python -c "import app.main; print('OK')"
        env:
          OPENAI_API_KEY: test
